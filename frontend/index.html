<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Lock the webview to embedded, same-origin assets only (no remote origins:
       no remote scripts/styles/fonts/images, no exfiltration). 'unsafe-inline'
       is retained for the Wails runtime bootstrap and bundled styles. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Helm</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="panel-header">
    <div class="header-top">
      <span class="panel-title">
        <i class="ti ti-steering-wheel" aria-hidden="true"></i> Helm
      </span>
      <div class="header-actions">
        <button id="btn-start-all" class="hbtn start">Start all</button>
        <button id="btn-stop-all" class="hbtn stop">Stop all</button>
      </div>
    </div>
    <div class="status-bar">
      <span class="status-dot" id="global-dot"></span>
      <span class="status-text" id="global-text">Scanning…</span>
    </div>
  </header>

  <!-- Update banner (distinct from service-state colours); text set via
       textContent only. Shown when a newer release is detected. -->
  <div id="update-banner" class="update-banner" role="status" hidden>
    <span id="update-text" class="update-text"></span>
    <span class="update-actions">
      <button id="update-view" class="update-btn">View release</button>
      <button id="update-download" class="update-btn primary">Download</button>
      <button id="update-dismiss" class="update-btn" aria-label="Dismiss">✕</button>
    </span>
  </div>

  <div id="services-list"></div>

  <!-- Non-blocking status/error surface; text set via textContent only. -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <footer class="panel-footer">
    <button id="btn-scan" class="footer-btn">
      <i class="ti ti-radar" aria-hidden="true"></i> Scan for services
    </button>
    <button id="btn-check-update" class="footer-btn">
      <i class="ti ti-refresh" aria-hidden="true"></i> Check for updates
    </button>
    <span id="app-version" class="app-version" title="Installed version"></span>
    <button id="btn-close" class="footer-btn" aria-label="Close">
      <i class="ti ti-x" aria-hidden="true"></i>
    </button>
  </footer>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
