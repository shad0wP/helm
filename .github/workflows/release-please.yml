name: release-please

# On every push to main, release-please maintains a Release PR from the
# Conventional Commit history (bumping version.txt + CHANGELOG.md). Merging that
# PR tags the version and creates a GitHub Release; the gated build jobs below
# then attach the macOS + Linux artifacts and checksums.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          check-latest: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install pinned Wails and staticcheck
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.106
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Verify source and dependencies
        run: |
          (cd frontend && npm ci --no-audit --no-fund && npm audit --audit-level=high && npm run build)
          version="$(tr -d '[:space:]' < version.txt)"
          grep -F "version: \"$version\" # x-release-please-version" build/config.yml
          grep -F "version: \"$version\" # x-release-please-version" build/linux/nfpm/nfpm.yaml
          test "$(grep -c ">$version</string><!-- x-release-please-version -->" build/darwin/Info.plist)" -eq 2
          test -z "$(gofmt -l .)"
          go vet ./...
          staticcheck ./...
          go test -race ./...
          govulncheck ./...
          wails3 doctor
          wails3 build
          go build -tags server -o /tmp/helm-server-disabled .
          if /tmp/helm-server-disabled >/tmp/helm-server.log 2>&1; then
            echo "FAIL: unsupported server mode started"; exit 1
          fi
          grep -F "Helm server mode is disabled" /tmp/helm-server.log

  release-please:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Pinned to v4. This action currently ships a Node.js 20 runtime
      # manifest, so GitHub Actions emits a "Node.js 20 deprecated" warning
      # even though the job itself runs fine — it's a known upstream issue in
      # release-please-action v4 (the action hasn't republished its
      # action.yml to target Node 24 yet). The runner safely forces execution
      # onto its bundled Node 24 regardless of the manifest, so this is
      # cosmetic; no functional impact.
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          # Prefer a PAT/App token (RELEASE_PLEASE_TOKEN) if present so releases
          # can trigger OTHER workflows; otherwise the built-in token works
          # because the build jobs below run in THIS same workflow run.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  build-linux:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install GTK4 + WebKitGTK 6.0
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          check-latest: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.106

      - name: Build + package (linux/amd64)
        run: |
          set -euxo pipefail
          VERSION="${TAG#v}"
          # Keep the package version in lock-step with the release tag.
          sed -i "s/^version:.*/version: \"$VERSION\"/" build/linux/nfpm/nfpm.yaml
          wails3 build
          # helm-cli: the terminal face of the same product (static, no GUI deps).
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o bin/helm-cli ./cmd/helm-cli
          tar -C bin -czf "bin/helm-${VERSION}-linux-amd64.tar.gz" helm helm-cli
          GOARCH=amd64 wails3 tool package -name helm -format archlinux -config ./build/linux/nfpm/nfpm.yaml -out ./bin
          GOARCH=amd64 wails3 tool package -name helm -format deb       -config ./build/linux/nfpm/nfpm.yaml -out ./bin
          GOARCH=amd64 wails3 tool package -name helm -format rpm       -config ./build/linux/nfpm/nfpm.yaml -out ./bin
          mv bin/helm.pkg.tar.zst "bin/helm-${VERSION}-linux-x86_64.pkg.tar.zst"
          mv bin/helm.deb         "bin/helm-${VERSION}-linux-amd64.deb"
          mv bin/helm.rpm         "bin/helm-${VERSION}-linux-x86_64.rpm"
          ( cd bin && sha256sum helm-*-linux-*.tar.gz ./*.pkg.tar.zst ./*.deb ./*.rpm > SHA256SUMS-linux.txt )

      - name: Attach Linux artifacts to the release
        run: |
          set -eux
          cd bin
          gh release upload "$TAG" \
            helm-*-linux-amd64.tar.gz ./*.pkg.tar.zst ./*.deb ./*.rpm SHA256SUMS-linux.txt \
            --repo "$GITHUB_REPOSITORY"

  build-macos:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-14
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          check-latest: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.106

      - name: Build universal .app + archives
        run: |
          set -euxo pipefail
          wails3 task darwin:package:universal
          codesign --force --deep --sign - bin/helm.app
          codesign --verify --deep --strict bin/helm.app
          ditto -c -k --sequesterRsrc --keepParent bin/helm.app "bin/Helm-${TAG}-macos-universal.app.zip"
          # helm-cli: universal binary of the same product's terminal face.
          VERSION="${TAG#v}"
          CGO_ENABLED=0 GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o bin/helm-cli-amd64 ./cmd/helm-cli
          CGO_ENABLED=0 GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o bin/helm-cli-arm64 ./cmd/helm-cli
          lipo -create -output bin/helm-cli bin/helm-cli-amd64 bin/helm-cli-arm64
          rm bin/helm-cli-amd64 bin/helm-cli-arm64
          tar -C bin -czf "bin/helm-${TAG}-macos-universal.tar.gz" helm helm-cli
          ( cd bin && shasum -a 256 Helm-*-macos-universal.app.zip helm-*-macos-universal.tar.gz > SHA256SUMS-macos.txt )

      - name: Attach macOS artifacts to the release
        run: |
          set -eux
          cd bin
          gh release upload "$TAG" \
            Helm-*-macos-universal.app.zip helm-*-macos-universal.tar.gz SHA256SUMS-macos.txt \
            --repo "$GITHUB_REPOSITORY"
