name: Build Linux

# Builds a native linux/amd64 binary (CGO + GTK4 + WebKitGTK 6.0) and attaches
# the binary tarball plus distro packages (Arch / deb / rpm) to a GitHub release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to build and validate against version.txt"
        required: true
      publish:
        description: "Attach artifacts to that release (immutable; fails if assets exist)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (amd64)
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate release identity
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < version.txt)"
          test "$RELEASE_TAG" = "v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install system dependencies (GTK4 + WebKitGTK 6.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          check-latest: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.106

      - name: Environment check
        run: wails3 doctor

      - name: Build (native linux/amd64)
        run: wails3 build

      - name: Package
        env:
          GOARCH: amd64
        run: |
          set -euxo pipefail
          test -f bin/helm
          sed -i "s/^version:.*/version: \"$VERSION\" # x-release-please-version/" build/linux/nfpm/nfpm.yaml
          # helm-cli: the terminal face of the same product (static, no GUI deps).
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o bin/helm-cli ./cmd/helm-cli
          # Raw binary tarball (works on any distro with gtk4 + webkitgtk-6.0 installed)
          tar -C bin -czf "bin/helm-${VERSION}-linux-amd64.tar.gz" helm helm-cli
          # Native distro packages via the bundled nfpm. Arch is ideal for CachyOS.
          wails3 tool package -name helm -format archlinux -config ./build/linux/nfpm/nfpm.yaml -out ./bin
          wails3 tool package -name helm -format deb       -config ./build/linux/nfpm/nfpm.yaml -out ./bin
          wails3 tool package -name helm -format rpm       -config ./build/linux/nfpm/nfpm.yaml -out ./bin
          # Give the packages conventional, versioned filenames.
          mv bin/helm.pkg.tar.zst "bin/helm-${VERSION}-linux-x86_64.pkg.tar.zst"
          mv bin/helm.deb         "bin/helm-${VERSION}-linux-amd64.deb"
          mv bin/helm.rpm         "bin/helm-${VERSION}-linux-x86_64.rpm"
          ls -la bin

      - name: Checksums
        run: |
          cd bin
          shopt -s nullglob
          files=( helm-*-linux-amd64.tar.gz *.pkg.tar.zst *.deb *.rpm )
          sha256sum "${files[@]}" | tee SHA256SUMS-linux.txt

      - name: Upload build artifacts (workflow)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helm-linux-amd64
          path: |
            bin/helm-*-linux-amd64.tar.gz
            bin/*.pkg.tar.zst
            bin/*.deb
            bin/*.rpm
            bin/SHA256SUMS-linux.txt
          if-no-files-found: error

      - name: Attach to GitHub release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd bin
          shopt -s nullglob
          assets=( helm-*-linux-amd64.tar.gz *.pkg.tar.zst *.deb *.rpm SHA256SUMS-linux.txt )
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "${{ github.repository }}"
