name: helm
arch: ${GOARCH}
platform: linux
version: 0.3.1
section: default
priority: extra
maintainer: shad0wP <202858710+shad0wP@users.noreply.github.com>
description: Helm — native menu bar / system tray controller for a local AI stack.
vendor: shad0wP
homepage: https://github.com/shad0wP/helm
license: MIT
release: '1'
contents:
  - src: ./bin/helm
    dst: /usr/local/bin/helm
  - src: ./bin/helm-cli
    dst: /usr/local/bin/helm-cli
  - src: ./build/appicon.png
    dst: /usr/share/icons/hicolor/128x128/apps/helm.png
  - src: ./build/linux/helm.desktop
    dst: /usr/share/applications/helm.desktop
  - src: ./LICENSE
    dst: /usr/share/licenses/helm/LICENSE
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0
scripts:
  postinstall: ./build/linux/nfpm/scripts/postinstall.sh
  postremove: ./build/linux/nfpm/scripts/postremove.sh
